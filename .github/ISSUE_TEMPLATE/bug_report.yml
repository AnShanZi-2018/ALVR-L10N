name: Bug report
description: Something does not work (wrong language, crash, ALVR not detected…)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please include enough detail to reproduce it.
  - type: input
    id: alvr-version
    attributes:
      label: ALVR version
      description: Shown in the tool next to "ALVR installation", or in ALVR's title bar.
      placeholder: v20.14.1
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: ALVR folder layout
      options:
        - "installations\\v<version>\\ALVR Dashboard.exe (launcher-managed)"
        - "ALVR Dashboard.exe directly in the folder (portable)"
        - not sure
  - type: dropdown
    id: mode
    attributes:
      label: Which mode did the tool use?
      options:
        - Full build (status said 100%)
        - Compatibility mode (partial)
        - it failed before applying
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, what did you get? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: alvr-l10n.log
      description: The log file next to ALVR-L10N.exe (drag it here).
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I closed ALVR before pressing Apply
        - label: I still have my session.json (backups are in <ALVR>\配置备份\)
