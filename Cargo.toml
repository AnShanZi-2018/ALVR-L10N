[package]
name = "alvr-l10n"
version = "1.0.0"
edition = "2021"
description = "Standalone language tool for ALVR (language packs + version-matched builds + in-place patch fallback)"
license = "MIT"

[[bin]]
name = "ALVR-L10N"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
rfd = { version = "0.14", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
