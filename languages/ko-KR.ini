ALVR requires a dedicated and recent graphics card. Low-end Intel integrated graphics may fail to work.\nMake sure you have at least one output audio device. = ALVR에는 최신 전용 그래픽 카드가 필요합니다. 저사양 Intel 내장 그래픽에서는 작동하지 않을 수 있습니다.\n출력 오디오 기기가 하나 이상 있는지 확인하세요.
ALVR requires running SteamVR! Devices will not be discovered or connected = ALVR을 사용하려면 SteamVR을 실행해야 합니다! 실행하지 않으면 장치가 검색되거나 연결되지 않습니다
ALVR streamer v* = ALVR 스트리머 v
ALVR supports custom button bindings! If you need help, please ask us on our Discord server. = ALVR은 사용자 지정 버튼 바인딩을 지원합니다! 도움이 필요하면 Discord 서버에서 문의하세요.
ALVR supports hand tracking gestures ("Presets"->"Hand tracking interaction"->"ALVR Bindings"). Check out wiki how to use them properly: https://github.com/alvr-org/ALVR/wiki/Hand-tracking-controller-bindings. = ALVR은 핸드 트래킹 제스처를 지원합니다("프리셋"->"핸드 트래킹 상호 작용"->"ALVR 바인딩"). 올바른 사용법은 위키를 참고하세요: https://github.com/alvr-org/ALVR/wiki/Hand-tracking-controller-bindings.
ALVR supports multiple types of PC hardware and headsets but not all might work correctly with default settings. Please try tweaking different settings like resolution, bitrate, encoder and others if your ALVR experience is not optimal. = ALVR은 다양한 PC 하드웨어와 헤드셋을 지원하지만 모든 조합이 기본 설정에서 제대로 작동하는 것은 아닙니다. ALVR 환경이 최적이 아니면 해상도, 비트레이트, 인코더 등 다양한 설정을 조정해 보세요.
