How close the tips of your fingers need to be to register a pinch click. = 핀치 클릭으로 인식되려면 손가락 끝이 얼마나 가까워야 하는지 설정합니다.
How close to your palm the tips of your fingers need to be to register a curl click. = 손가락 끝이 손바닥에 얼마나 가까워야 컬 클릭으로 인식되는지 설정합니다.
How close to your palm the tips of your fingers need to be to start registering a trigger pull. = 손가락 끝이 손바닥에 얼마나 가까워야 트리거 당김으로 인식되기 시작하는지 설정합니다.
How close together the tips of your fingers need to be to start registering a pinch trigger pull. = 손가락 끝이 얼마나 가까워야 핀치 트리거 당김으로 인식되기 시작하는지 설정합니다.
How long the after the gesture has been deactivated before it can be activated again. = 제스처가 해제된 후 다시 활성화되기까지 기다려야 하는 시간입니다.
How long the gesture must be continuously held before it is activated. = 제스처가 활성화되기 전까지 계속 유지해야 하는 시간입니다.
How long the gesture must be continuously released before it is deactivated. = 제스처가 해제되기 전까지 계속 놓고 있어야 하는 시간입니다.
