Disabled: the playspace orientation is determined by the room-scale guardian setup.\nYaw: the forward direction is reset when long pressing the oculus button.\nTilted: the world gets tilted when long pressing the oculus button. This is useful for using VR while laying down. = Disabled: 플레이 공간 방향은 룸스케일 가디언 설정에 따라 결정됩니다.\n요: Oculus 버튼을 길게 누르면 정면 방향이 재설정됩니다.\n기울임: Oculus 버튼을 길게 누르면 세계가 기울어집니다. 누워서 VR을 사용할 때 유용합니다.
Disabled: the playspace origin is determined by the room-scale guardian setup.\nLocal floor: the origin is on the floor and resets when long pressing the oculus button.\nLocal: the origin resets when long pressing the oculus button, and is calculated as an offset from the current head position. = Disabled: 플레이 공간 원점은 룸스케일 가디언 설정에 따라 결정됩니다.\n로컬 바닥: 원점이 바닥에 있으며 Oculus 버튼을 길게 누르면 재설정됩니다.\n로컬: Oculus 버튼을 길게 누르면 원점이 재설정되며 현재 머리 위치로부터의 오프셋으로 계산됩니다.
Disabling foveated encoding may result in significantly higher encode/decode times and stuttering, or even crashing.\nIf you want to reduce the amount of pixelation on the edges, increase the center region width and height = 시선 집중 인코딩을 비활성화하면 인코딩/디코딩 시간이 크게 늘어나고 끊기거나 심지어 충돌할 수 있습니다.\n가장자리의 픽셀화를 줄이려면 중앙 영역의 너비와 높이를 늘리세요
