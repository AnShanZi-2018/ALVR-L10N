Higher values make the controllers track smoother.\nTechnically, this is the time (counted in frames) between pose submitted to SteamVR and the corresponding virtual vsync happens.\nCurrently this cannot be reliably estimated automatically. The correct value should be 2 but 3 is default for smoother tracking at the cost of slight lag. = 값이 클수록 컨트롤러 추적이 더 부드러워집니다.\n기술적으로는 포즈가 SteamVR에 제출된 후 해당 가상 수직 동기화가 발생하기까지의 시간(프레임 단위)입니다.\n현재 이를 자동으로 안정적으로 추정할 수 없습니다. 올바른 값은 2이지만, 약간의 지연을 감수하고 더 부드러운 추적을 위해 기본값은 3입니다.
