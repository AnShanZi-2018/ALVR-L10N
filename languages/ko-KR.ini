If hand tracking gestures are annoying, you can disable them in "Controllers"->"Gestures". Alternatively, you can enable "Gestures"->"Only touch". = 핸드 트래킹 제스처가 거슬리면 "컨트롤러"->"제스처"에서 비활성화할 수 있습니다. 또는 "제스처"->"터치만"을 활성화하세요.
If the client has no preference, enables compositing VR layers to an RGBA float16 framebuffer, and doing sRGB/YUV conversions in shader code. = 클라이언트 설정이 없으면 VR 레이어를 RGBA float16 프레임버퍼로 합성하고 셰이더 코드에서 sRGB/YUV 변환을 수행합니다.
If the client, server or the network discarded one packet, discard packets until a IDR packet is found. = 클라이언트, 서버 또는 네트워크에서 패킷을 하나 버리면 IDR 패킷을 찾을 때까지 패킷을 버립니다.
If the framerate changes more than this factor, trigger a parameters update = 프레임률 변화가 이 배율을 넘으면 매개변수 업데이트를 트리거합니다
If the visual controller/hand models do not match the physical controller, you can tweak the offset in "Headset"->"Controllers"->"Left controller position/rotation offset" (affects both controllers). = 컨트롤러/손 모델이 물리 컨트롤러와 일치하지 않으면 "헤드셋"->"컨트롤러"->"왼쪽 컨트롤러 위치/회전 오프셋"에서 오프셋을 조정할 수 있습니다(두 컨트롤러 모두에 적용됨).
If trackers have not been calibrated before, the calibration process will start after you connect to the streamer. = 트래커를 이전에 보정한 적이 없으면 스트리머에 연결한 후 보정이 시작됩니다.
If you experience "white snow" flickering, reduce the resolution to "Low" and disable "Foveated encoding". = "흰 눈" 깜빡임이 발생하면 해상도를 "낮음"으로 설정하고 "시선 집중 인코딩"을 비활성화하세요.
If you have problems syncing external controllers or trackers to ALVR tracking space, add one element to "Extra openvr props", then set a custom "Tracking system name". = 외부 컨트롤러나 트래커를 ALVR 트래킹 공간에 동기화하는 데 문제가 있으면 "추가 OpenVR 속성"에 요소를 하나 추가한 다음 사용자 지정 "트래킹 시스템 이름"을 설정하세요.
If you often experience image glitching, you can trade that with stutter frames using "Avoid video glitching". = 화면 깨짐이 자주 발생하면 "화면 깨짐 방지"를 사용해 프레임 끊김과 맞바꿀 수 있습니다.
If you started having crashes after changing some settings, reset ALVR by re-running "Run setup wizard" from the "Installation" tab and clicking "Reset settings". = 설정을 변경한 후 충돌이 발생하기 시작하면 "설치" 탭에서 "설정 마법사 실행"을 다시 실행하고 "설정 초기화"를 클릭하여 ALVR을 초기화하세요.
If you want to share a video recording for reporting a bug, you can enable "Extra"->"Capture"->"Rolling video files" to limit the file size of the upload = 버그를 보고할 비디오 녹화를 공유하려면 "추가 설정"->"캡처"->"순환 녹화 파일"을 활성화하여 업로드할 파일 크기를 제한할 수 있습니다
If you want to use body trackers or other SteamVR drivers together with ALVR, set "Driver launch action" to "Unregister ALVR at shutdown" = 바디 트래커나 다른 SteamVR 드라이버를 ALVR과 함께 사용하려면 "드라이버 실행 동작"을 "종료 시 ALVR 등록 해제"로 설정하세요
If you're using an NVIDIA GPU, it's best to use high-bitrate H264; if you're using an AMD GPU, HEVC might look better. = NVIDIA GPU를 사용하는 경우 높은 비트레이트의 H264가 가장 좋고, AMD GPU를 사용하는 경우 HEVC가 더 나아 보일 수 있습니다.
If your headset does not appear in the device list, it might be in a different subnet. Try "Add device manually" with IP shown from inside device. = 헤드셋이 기기 목록에 표시되지 않으면 다른 서브넷에 있을 수 있습니다. 기기에서 표시되는 IP로 "기기 수동 추가"를 시도하세요.
Image corruption fix = 화면 깨짐 수정
Improve clarity of high contrast edges and counteract blur.\nUseful when the input resolution is low compared to the headset display = 고대비 가장자리의 선명도를 개선하고 흐림을 줄입니다.\n헤드셋 디스플레이에 비해 입력 해상도가 낮을 때 유용합니다
Improves accuracy of the tracking at the cost of higher latency. = 지연 시간이 높아지는 대신 추적 정확도가 향상됩니다.
Improves visual quality by using the edge direction to upscale at a slight performance loss = 가장자리 방향을 사용하여 업스케일링해 화질을 개선합니다. 약간의 성능 저하가 있습니다
In CBR mode, this makes sure the bitrate does not fall below the assigned value. This is mostly useful for debugging. = CBR 모드에서 비트레이트가 지정된 값 아래로 떨어지지 않도록 합니다. 주로 디버깅에 유용합니다.
In case you want to report a bug and share your log, you should enable "Extra"->"Logging"->"Prefer backtrace". = 버그를 보고하고 로그를 공유하려면 "추가 설정"->"로깅"->"백트레이스 우선"을 활성화하세요.
In case you want to report a bug, to get a log file, enable "Extra"->"Logging"->"Log to disk". The log will be inside "session_log.txt". = 버그를 보고할 때 로그 파일을 얻으려면 "추가 설정"->"로깅"->"디스크에 로그 기록"을 활성화하세요. 로그는 "session_log.txt"에 저장됩니다.
Increasing "Color correction"->"Sharpness" may improve the perceived image quality. = "색상 보정"->"선명도"를 높이면 체감 화질이 개선될 수 있습니다.
Increasing "Maximum buffering" may reduce stutters at the cost of more latency. = "최대 버퍼링"을 늘리면 지연 시간이 증가하는 대신 끊김을 줄일 수 있습니다.
Increasing this value will help reduce stutter but it will increase latency = 이 값을 늘리면 끊김을 줄이는 데 도움이 되지만 지연 시간이 증가합니다
