You can quickly cycle through tips like this one by toggling "Show notification tip" = 打开/关闭“显示提示通知”即可快速切换这类提示
You can run custom commands/programs at headset connection/disconnection using the "On connect/disconnect script". = 可以用“连接/断开时执行的脚本”在头显连接或断开时运行自定义命令或程序。
You probably don't want to change this. Allows for changing adapter for ALVR compositor. = 通常不需要改动。用于更换 ALVR 合成器使用的显卡适配器。
