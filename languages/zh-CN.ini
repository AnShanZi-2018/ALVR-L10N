ALVR requires a dedicated and recent graphics card. Low-end Intel integrated graphics may fail to work.\nMake sure you have at least one output audio device. = ALVR 需要一张较新的独立显卡，低端 Intel 核显可能无法工作。\n请确保至少有一个可用的输出音频设备。
