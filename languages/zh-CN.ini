If hand tracking gestures are annoying, you can disable them in "Controllers"->"Gestures". Alternatively, you can enable "Gestures"->"Only touch". = 如果手势操作很烦，可以在“控制器”→“手势”里关闭；也可以开启“手势”→“仅触摸”。
If the client has no preference, enables compositing VR layers to an RGBA float16 framebuffer, and doing sRGB/YUV conversions in shader code. = 如果客户端没有指定，则把 VR 图层合成到 RGBA float16 帧缓冲，并在着色器中完成 sRGB/YUV 转换。
If the client, server or the network discarded one packet, discard packets until a IDR packet is found. = 如果客户端、服务端或网络丢弃了数据包，则一直丢弃数据包直到遇到 IDR 包。
If the framerate changes more than this factor, trigger a parameters update = 帧率变化超过这个倍数时触发参数更新
If the visual controller/hand models do not match the physical controller, you can tweak the offset in "Headset"->"Controllers"->"Left controller position/rotation offset" (affects both controllers). = 如果控制器/手部模型与实物位置对不上，可以在“头显”→“控制器”→“左控制器位置/旋转偏移”里微调（会同时影响两个控制器）。
If trackers have not been calibrated before, the calibration process will start after you connect to the streamer. = 如果追踪器之前没有校准过，连接串流端后会自动开始校准。
If you experience "white snow" flickering, reduce the resolution to "Low" and disable "Foveated encoding". = 如果画面出现“雪花”闪烁，请把分辨率降到“低”并关闭“注视点编码”。
If you have problems syncing external controllers or trackers to ALVR tracking space, add one element to "Extra openvr props", then set a custom "Tracking system name". = 如果外置控制器或追踪器无法与 ALVR 的追踪空间对齐，可以在“额外 OpenVR 属性”里添加一个元素，然后自定义“追踪系统名称”。
If you often experience image glitching, you can trade that with stutter frames using "Avoid video glitching". = 如果经常出现画面花屏，可以用“避免画面花屏”来换取一些掉帧。
If you started having crashes after changing some settings, reset ALVR by re-running "Run setup wizard" from the "Installation" tab and clicking "Reset settings". = 如果改过设置后开始崩溃，可以在“安装”标签页重新运行“运行安装向导”并点击“重置设置”来恢复。
If you want to share a video recording for reporting a bug, you can enable "Extra"->"Capture"->"Rolling video files" to limit the file size of the upload = 如果要分享录像来反馈 Bug，可以开启“额外设置”→“录制”→“循环录像文件”来限制上传文件的大小
If you want to use body trackers or other SteamVR drivers together with ALVR, set "Driver launch action" to "Unregister ALVR at shutdown" = 如果要和 ALVR 一起使用身体追踪器或其他 SteamVR 驱动，请把“驱动启动方式”设为“关闭时注销 ALVR”
If you're using an NVIDIA GPU, it's best to use high-bitrate H264; if you're using an AMD GPU, HEVC might look better. = 使用 NVIDIA 显卡时，高码率 H264 效果最好；使用 AMD 显卡时，HEVC 可能更好看。
If your headset does not appear in the device list, it might be in a different subnet. Try "Add device manually" with IP shown from inside device. = 如果头显没有出现在设备列表里，可能不在同一网段。可以尝试“手动添加设备”，填写头显里显示的 IP。
Image corruption fix = 画面花屏修复
