Disabled: hands cannot emulate buttons. Useful for using Joy-Cons or other non-native controllers.\nSteamVR Input 2.0: create separate SteamVR devices for hand tracking.\nALVR bindings: use ALVR hand tracking button bindings. Check the wiki for help.\n = 禁用：手部无法模拟按键，适合使用 Joy-Con 等非原生控制器。\nSteamVR Input 2.0：为手部追踪创建独立的 SteamVR 设备。\nALVR 按键绑定：使用 ALVR 的手部追踪按键绑定，帮助见 wiki。\n
Disabled: the playspace orientation is determined by the room-scale guardian setup.\nYaw: the forward direction is reset when long pressing the oculus button.\nTilted: the world gets tilted when long pressing the oculus button. This is useful for using VR while laying down. = 禁用：游玩空间朝向由房间边界设置决定。\n偏航：长按 Oculus 键时重置正前方向。\n倾斜：长按 Oculus 键时世界会倾斜，躺着玩 VR 时很有用。
Disabled: the playspace origin is determined by the room-scale guardian setup.\nLocal floor: the origin is on the floor and resets when long pressing the oculus button.\nLocal: the origin resets when long pressing the oculus button, and is calculated as an offset from the current head position. = 禁用：游玩空间原点由房间边界设置决定。\n本地地面：原点位于地面，长按 Oculus 键时重置。\n本地：长按 Oculus 键时重置，位置按当前头部位置的偏移计算。
