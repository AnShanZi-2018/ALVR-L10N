Higher values make the controllers track smoother.\nTechnically, this is the time (counted in frames) between pose submitted to SteamVR and the corresponding virtual vsync happens.\nCurrently this cannot be reliably estimated automatically. The correct value should be 2 but 3 is default for smoother tracking at the cost of slight lag. = 数值越大，控制器追踪越平滑。\n严格来说，它表示位姿提交给 SteamVR 到对应虚拟垂直同步之间的帧数。\n目前无法可靠地自动估算：正确值应为 2，但默认 3 可以让追踪更平滑，代价是轻微延迟。
