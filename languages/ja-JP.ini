If the visual controller/hand models do not match the physical controller, you can tweak the offset in "Headset"->"Controllers"->"Left controller position/rotation offset" (affects both controllers). = コントローラー/ハンドの表示モデルが実機と合わない場合は、「ヘッドセット」→「コントローラー」→「左コントローラーの位置/回転オフセット」で調整できます（両方のコントローラーに影響します）。
If trackers have not been calibrated before, the calibration process will start after you connect to the streamer. = トラッカーが未キャリブレーションの場合、ストリーマーに接続した後にキャリブレーションが開始されます。
If you experience "white snow" flickering, reduce the resolution to "Low" and disable "Foveated encoding". = 「白い雪」のようなちらつきが出る場合は、解像度を「低」に下げ、「フォービエイテッドエンコーディング」を無効にしてください。
If you have problems syncing external controllers or trackers to ALVR tracking space, add one element to "Extra openvr props", then set a custom "Tracking system name". = 外部コントローラーやトラッカーを ALVR のトラッキング空間に同期できない場合は、「追加の OpenVR プロパティ」に要素を 1 つ追加し、「トラッキングシステム名」をカスタム設定してください。
If you often experience image glitching, you can trade that with stutter frames using "Avoid video glitching". = 画面の乱れが頻繁に起きる場合は、「映像の乱れを回避」でフレーム落ちと引き換えにできます。
If you started having crashes after changing some settings, reset ALVR by re-running "Run setup wizard" from the "Installation" tab and clicking "Reset settings". = 設定を変更してからクラッシュするようになった場合は、「インストール」タブで「セットアップウィザードを実行」を再実行し、「設定をリセット」をクリックして ALVR をリセットしてください。
If you want to share a video recording for reporting a bug, you can enable "Extra"->"Capture"->"Rolling video files" to limit the file size of the upload = バグ報告用に録画を共有する場合は、「拡張」→「キャプチャ」→「録画ファイルのローリング」を有効にすると、アップロードするファイルサイズを抑えられます
If you want to use body trackers or other SteamVR drivers together with ALVR, set "Driver launch action" to "Unregister ALVR at shutdown" = ボディトラッカーや他の SteamVR ドライバーを ALVR と併用する場合は、「ドライバーの起動動作」を「終了時に ALVR の登録を解除」に設定してください
If you're using an NVIDIA GPU, it's best to use high-bitrate H264; if you're using an AMD GPU, HEVC might look better. = NVIDIA GPU を使っている場合は高ビットレートの H264 が最適です。AMD GPU の場合は HEVC のほうが画質が良くなる可能性があります。
If your headset does not appear in the device list, it might be in a different subnet. Try "Add device manually" with IP shown from inside device. = ヘッドセットがデバイス一覧に表示されない場合は、別のサブネットにいる可能性があります。デバイス側に表示される IP を使って「デバイスを手動で追加」を試してください。
Image corruption fix = 画面破損の修正
Improve clarity of high contrast edges and counteract blur.\nUseful when the input resolution is low compared to the headset display = 高コントラストのエッジの輪郭を改善し、ぼやけを抑えます。\n入力解像度がヘッドセットの表示より低い場合に便利です
Improves accuracy of the tracking at the cost of higher latency. = レイテンシと引き換えにトラッキング精度を向上させます。
