Disabled: the playspace orientation is determined by the room-scale guardian setup.\nYaw: the forward direction is reset when long pressing the oculus button.\nTilted: the world gets tilted when long pressing the oculus button. This is useful for using VR while laying down. = Disabled: プレイスペースの向きはルームスケールのガーディアン設定で決まります。\nヨー: Oculus ボタンの長押しで正面方向がリセットされます。\nチルト: Oculus ボタンの長押しでワールドが傾きます。寝ながら VR を使う場合に便利です。
Disabled: the playspace origin is determined by the room-scale guardian setup.\nLocal floor: the origin is on the floor and resets when long pressing the oculus button.\nLocal: the origin resets when long pressing the oculus button, and is calculated as an offset from the current head position. = Disabled: プレイスペースの原点はルームスケールのガーディアン設定で決まります。\nローカルフロア: 原点は床面にあり、Oculus ボタンの長押しでリセットされます。\nローカル: Oculus ボタンの長押しで原点がリセットされ、現在の頭の位置からのオフセットとして計算されます。
