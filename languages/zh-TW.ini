Disabled: hands cannot emulate buttons. Useful for using Joy-Cons or other non-native controllers.\nSteamVR Input 2.0: create separate SteamVR devices for hand tracking.\nALVR bindings: use ALVR hand tracking button bindings. Check the wiki for help.\n = 停用：手部無法模擬按鍵，適合使用 Joy-Con 等非原生控制器。\nSteamVR Input 2.0：為手部追蹤建立獨立的 SteamVR 裝置。\nALVR 按鍵綁定：使用 ALVR 的手部追蹤按鍵綁定，說明請見 wiki。\n
Disabled: the playspace orientation is determined by the room-scale guardian setup.\nYaw: the forward direction is reset when long pressing the oculus button.\nTilted: the world gets tilted when long pressing the oculus button. This is useful for using VR while laying down. = 停用：遊玩空間的朝向由房間規模的守護者設定決定。\n偏航：長按 Oculus 鍵時重設前方方向。\n傾斜：長按 Oculus 鍵時世界會傾斜，躺著玩 VR 時很有用。
Disabled: the playspace origin is determined by the room-scale guardian setup.\nLocal floor: the origin is on the floor and resets when long pressing the oculus button.\nLocal: the origin resets when long pressing the oculus button, and is calculated as an offset from the current head position. = 停用：遊玩空間的原點由房間規模的守護者設定決定。\n本機地面：原點位於地面上，長按 Oculus 鍵時重設。\n本機：長按 Oculus 鍵時重設，位置以目前頭部位置的偏移量計算。
