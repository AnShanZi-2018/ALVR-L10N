Higher values make the controllers track smoother.\nTechnically, this is the time (counted in frames) between pose submitted to SteamVR and the corresponding virtual vsync happens.\nCurrently this cannot be reliably estimated automatically. The correct value should be 2 but 3 is default for smoother tracking at the cost of slight lag. = 數值越大，控制器追蹤越平滑。\n技術上來說，這是指位姿提交給 SteamVR 到對應的虛擬垂直同步之間的時間（以影格數計算）。\n目前無法可靠地自動估算。正確值應為 2，但預設為 3，可讓追蹤更平滑，代價是輕微延遲。
