ALVR requires a dedicated and recent graphics card. Low-end Intel integrated graphics may fail to work.\nMake sure you have at least one output audio device. = ALVR 需要一張較新的獨立顯示卡，低階 Intel 內建顯示晶片可能無法運作。\n請確認至少有一個可用的輸出音訊裝置。
