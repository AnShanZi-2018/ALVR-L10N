If hand tracking gestures are annoying, you can disable them in "Controllers"->"Gestures". Alternatively, you can enable "Gestures"->"Only touch". = 如果手勢操作很擾人，可以在「控制器」→「手勢」裡關閉；也可以開啟「手勢」→「僅觸碰」。
If the client has no preference, enables compositing VR layers to an RGBA float16 framebuffer, and doing sRGB/YUV conversions in shader code. = 若用戶端未指定，則將 VR 圖層合成到 RGBA float16 影格緩衝，並在著色器中完成 sRGB/YUV 轉換。
If the client, server or the network discarded one packet, discard packets until a IDR packet is found. = 若用戶端、伺服器端或網路丟棄了封包，就持續丟棄封包直到遇到 IDR 封包。
If the framerate changes more than this factor, trigger a parameters update = 影格率變化超過此倍數時觸發參數更新
If the visual controller/hand models do not match the physical controller, you can tweak the offset in "Headset"->"Controllers"->"Left controller position/rotation offset" (affects both controllers). = 如果控制器/手部模型與實物位置不符，可以在「頭戴式裝置」→「控制器」→「左控制器位置/旋轉偏移」裡微調（會同時影響兩個控制器）。
If trackers have not been calibrated before, the calibration process will start after you connect to the streamer. = 如果追蹤器之前未曾校正過，連線到串流端後會開始校正流程。
If you experience "white snow" flickering, reduce the resolution to "Low" and disable "Foveated encoding". = 如果畫面出現「雪花」閃爍，請把解析度降到「低」並關閉「注視點編碼」。
If you have problems syncing external controllers or trackers to ALVR tracking space, add one element to "Extra openvr props", then set a custom "Tracking system name". = 如果外接控制器或追蹤器無法與 ALVR 的追蹤空間對齊，可以在「額外 OpenVR 屬性」裡新增一個元素，然後自訂「追蹤系統名稱」。
If you often experience image glitching, you can trade that with stutter frames using "Avoid video glitching". = 如果經常出現畫面破圖，可以用「避免畫面破圖」來換取一些掉格。
